name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Turbo remote cache (Vercel). Without these secrets Turbo runs with local cache only.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      # Runs lint, format:check, typecheck, build, and test through Turbo (uses the remote cache).
      - run: bun run ci

  deploy-workflow:
    name: Deploy workflow smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No install needed — static check of workflow YAML vs package.json scripts.
      - run: bun ./scripts/check-deploy-workflow.ts
      - run: bun test scripts/check-deploy-workflow.test.ts
