# Cloudflare adapter deploy (ticket 63 + post-merge staging on dev).
# - push to main → production Worker (`agentos-demo` → agentos-demo.thatlad.dev)
# - push to dev  → staging Worker (`agentos` → agentos.thatlad.workers.dev)
# - workflow_dispatch → choose production | dev
# PRs never deploy — see deploy/cloudflare/README.md (CI / preview policy).
name: Deploy Cloudflare

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment
        type: choice
        options:
          - production
          - dev
        default: production

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: CI + wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy workflow smoke
        run: bun ./scripts/check-deploy-workflow.ts

      - name: CI
        # Must be `pnpm run ci` — bare `pnpm ci` is a pnpm builtin (unimplemented).
        run: pnpm run ci

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "env=dev" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ steps.target.outputs.env }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets. Refusing to deploy ($DEPLOY_ENV)."
            exit 1
          fi
          echo "Deploy target: $DEPLOY_ENV"

      - name: Deploy Cloudflare adapter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ steps.target.outputs.env }}" = "dev" ]; then
            pnpm run deploy:cloudflare:dev
          else
            pnpm run deploy:cloudflare
          fi
